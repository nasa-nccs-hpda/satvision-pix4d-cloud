[project]
name = "satvision-pix4d-cloud"
version = "0.1.0"
description = "SatVision temporal MAE training and synthetic benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightning==2.6.6",
  "torchmetrics==1.9.0",
  "timm==1.0.29",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "xarray>=2024.10,<2026",
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
  "yacs==0.1.8",
  "PyYAML>=6,<7",
  "tensorboard>=2.19,<3",
  "pillow>=11,<13",
]

# Select exactly one backend. CUDA extras include DeepSpeed on Linux.
[project.optional-dependencies]
cpu = ["torch==2.7.1", "torchvision==0.22.1"]
cu126 = ["torch==2.7.1", "torchvision==0.22.1", "deepspeed==0.17.6; sys_platform == 'linux'"]
cu128 = ["torch==2.7.1", "torchvision==0.22.1", "deepspeed==0.17.6; sys_platform == 'linux'"]
mlflow = ["mlflow>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
required-version = ">=0.9.0"
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu128" }]]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Keep torch out of DeepSpeed's isolated build environment. With torch present
# on a GPU node, setup probes nvcc for optional CuPy extras even with ops disabled.
# Runtime torch is supplied by the selected backend extra above.
[tool.uv.extra-build-variables]
deepspeed = { DS_BUILD_OPS = "0" }
