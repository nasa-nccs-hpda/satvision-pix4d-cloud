BASE: [../pretrain/330m.yaml]
DATAMODULE: abi_temporal_benchmark
DATA:
  IMG_SIZE: 512
  BATCH_SIZE: 1
  LENGTH: 256
  NUM_WORKERS: 0
BENCHMARK:
  TIMESTEPS: 7
